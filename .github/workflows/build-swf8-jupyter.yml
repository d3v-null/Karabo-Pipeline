---
name: Build SWF-8 Jupyter Container

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests during build (1=yes, 0=no)"
        required: false
        default: "0"
  pull_request:
    paths:
      - "swf8-jupyter.Dockerfile"
      - "spack-overlay/**"
      - ".github/workflows/build-swf8-jupyter.yml"
      - ".github/scripts/test_phase3_notebook_stack.py"
  push:
    branches:
      - main
      - numpy2
    paths:
      - "swf8-jupyter.Dockerfile"
      - "spack-overlay/**"
      - ".github/workflows/build-swf8-jupyter.yml"
      - ".github/scripts/test_phase3_notebook_stack.py"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: swf8-jupyter

jobs:
  build-pretest:
    name: Build and publish -pretest by digest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux/amd64
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
          wf="${{ github.workflow }}"
          safe_wf=$(echo "$wf" | sed -E 's/[^A-Za-z0-9._-]+/-/g')
          echo "CACHE_SCOPE=${safe_wf}-${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check disk space
        run: df -h

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          [ -n "$AGENT_TOOLSDIRECTORY" ] && sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/miniconda
          sudo docker system prune -af --volumes
          sudo apt-get clean

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:v0.13.2
            network=host
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1
              gc = true
              gckeepstorage = 5000
            [worker.containerd]
              max-parallelism = 1
              gc = true
              gckeepstorage = 5000

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (-pretest)
        id: meta-pretest
        uses: docker/metadata-action@v5
        with:
          images: >-
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: |
            suffix=-pretest
          labels: |
            org.opencontainers.image.title=SWF-8 Jupyter
            org.opencontainers.image.description=Jupyter/Marimo with ps_eor[ml-gpr] (MWA Phase-3 CHIPS -> GPR) on SDP Spack

      - name: Build - by digest (always push)
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./swf8-jupyter.Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta-pretest.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            SPACK_TARGET=${{ matrix.platform == 'linux/amd64' && 'x86_64_v2' || 'aarch64' }}
            SPACK_MIRROR_OCI=oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/swf8-jupyter-spack-buildcache
          secrets: |
            spack_oci_username=${{ github.actor }}
            spack_oci_password=${{ github.token }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:buildcache-${{ env.PLATFORM_PAIR }}
          cache-to: |
            type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:buildcache-${{ env.PLATFORM_PAIR }},mode=max,compression=zstd,compression-level=3

      - name: Check disk space after build
        if: always()
        run: df -h

      - name: Export digest (push)
        if: steps.build-push.outcome == 'success'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build-push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest (push)
        if: steps.build-push.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-pretest:
    name: Publish multi-arch -pretest tag
    runs-on: ubuntu-latest
    needs: build-pretest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta (-pretest)
        id: meta-pretest
        uses: docker/metadata-action@v5
        with:
          images: >-
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: |
            suffix=-pretest

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push (-pretest)
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect -pretest image
        run: |
          IMAGE_REF="${{ fromJSON(steps.meta-pretest.outputs.json).tags[0] }}"
          docker buildx imagetools inspect "$IMAGE_REF"

  test:
    name: Run tests in image
    needs: [build-pretest, merge-pretest]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux/amd64
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker meta (-pretest)
        id: meta-pretest
        uses: docker/metadata-action@v5
        with:
          images: >-
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: |
            suffix=-pretest

      - name: Free up disk space for tests
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          [ -n "$AGENT_TOOLSDIRECTORY" ] && sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/miniconda
          sudo docker system prune -af --volumes
          sudo apt-get clean

      - name: Run smoke tests
        run: |
          IMAGE_REF="${{ fromJSON(steps.meta-pretest.outputs.json).tags[0] }}"
          docker run --rm "${IMAGE_REF}" python --version
          docker run --rm "${IMAGE_REF}" marimo --version
          docker run --rm "${IMAGE_REF}" python -c "import jupyterhub, marimo; print('Marimo and JupyterHub imports successful')"
          docker run --rm "${IMAGE_REF}" python -c "import numpy; assert numpy.__version__.startswith('2.'), numpy.__version__; print('numpy', numpy.__version__)"
          docker run --rm "${IMAGE_REF}" python -c "import scipy; assert scipy.__version__.startswith('1.14'), scipy.__version__; print('scipy', scipy.__version__)"
          docker run --rm "${IMAGE_REF}" python -c "import scipy.integrate as si; assert hasattr(si, 'trapz'), 'trapz shim missing (healpy/pspec)'"
          docker run --rm "${IMAGE_REF}" python -c "import healpy; print('healpy', healpy.__version__)"
          docker run --rm "${IMAGE_REF}" python -c "import ps_eor; from ps_eor import ml_gpr, datacube, psutil, pspec; print('ps_eor+ml_gpr+pspec OK', ps_eor.__version__)"
          docker run --rm "${IMAGE_REF}" python -c "import torch; print('torch', torch.__version__)"
          docker run --rm "${IMAGE_REF}" python -c "import gpytorch; print('gpytorch', gpytorch.__version__)"
          docker run --rm "${IMAGE_REF}" python -c "import pyro; print('pyro', pyro.__version__)"
          docker run --rm "${IMAGE_REF}" python -c "import emcee, corner; print('emcee', emcee.__version__, 'corner', corner.__version__)"
          docker run --rm "${IMAGE_REF}" python -c "from scipy.integrate import trapezoid; print('trapezoid OK')"
          docker run --rm "${IMAGE_REF}" python -c "import imageio, tqdm; print('imageio/tqdm OK')"

      - name: Phase-3 notebook stack (imports + GPR/PS smoke)
        run: |
          IMAGE_REF="${{ fromJSON(steps.meta-pretest.outputs.json).tags[0] }}"
          # Mirrors capabilities exercised by phase3_gpr_mwa_demo.py (CHIPS cube,
          # PowerSpectraBuilder.get, MultiData, MultiGPRegressor, MCMCSampler,
          # VAEFitter/VAEKernTorch symbols, imageio GIF). Fails if healpy/pspec
          # or the ml_gpr surface is broken — plain `import ml_gpr` is not enough.
          docker run --rm \
            -e MPLCONFIGDIR=/tmp/mpl \
            -e OPENBLAS_NUM_THREADS=1 \
            -v "$PWD/.github/scripts/test_phase3_notebook_stack.py:/tmp/test_phase3_notebook_stack.py:ro" \
            "${IMAGE_REF}" \
            python /tmp/test_phase3_notebook_stack.py

      - name: Check pip metadata consistency (non-fatal)
        run: |
          IMAGE_REF="${{ fromJSON(steps.meta-pretest.outputs.json).tags[0] }}"
          docker run --rm "${IMAGE_REF}" python -m pip check || \
            echo "pip check: known non-fatal metadata mismatches (see build log) — functional imports above are the real gate"

      - name: Verify Jupyter kernel is registered
        run: |
          IMAGE_REF="${{ fromJSON(steps.meta-pretest.outputs.json).tags[0] }}"
          docker run --rm "${IMAGE_REF}" jupyter kernelspec list | grep -q swf8

      - name: Verify Jupyter server starts and responds
        run: |
          IMAGE_REF="${{ fromJSON(steps.meta-pretest.outputs.json).tags[0] }}"
          CID=$(docker run -d -p 127.0.0.1:8888:8888 \
            --health-cmd='curl -fsS http://127.0.0.1:8888/api/status?token=test || exit 1' \
            --health-interval=10s \
            --health-retries=12 \
            --health-timeout=5s \
            "${IMAGE_REF}" start-notebook.sh \
              --NotebookApp.token='test' \
              --ServerApp.token='test' \
              --ServerApp.ip='0.0.0.0' \
              --ServerApp.port=8888)
          echo "Started container $CID, waiting for healthy status..."
          for i in $(seq 1 60); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$CID" 2>/dev/null || echo "unknown")
            echo "Health check $i/60: $STATUS"
            if [ "$STATUS" = "healthy" ]; then
              echo "Container is healthy!"
              break
            fi
            sleep 2
          done
          docker logs "$CID" --tail 50 || true
          curl -fsS "http://127.0.0.1:8888/api/status?token=test"
          echo "Jupyter server responded successfully"
          docker rm -f "$CID" >/dev/null

      - name: Test kernel execution
        run: |
          IMAGE_REF="${{ fromJSON(steps.meta-pretest.outputs.json).tags[0] }}"
          # `jupyter execute --kernel=... -` doesn't accept stdin as a notebook
          # source (nbclient's CLI reads an actual .ipynb path, not '-'), so
          # write a real one-cell notebook and pass its path. Mount it
          # read-only and let --output land inside the container's own
          # filesystem (relative to the input's parent dir per `jupyter
          # execute --help-all`) rather than bind-mounting an output path too
          # — writing back to a host-mounted dir hits a uid mismatch (image
          # runs as jovyan/1000) that has nothing to do with the test itself.
          cat > /tmp/test_kernel.ipynb <<'EOF'
          {
           "cells": [
            {
             "cell_type": "code",
             "execution_count": null,
             "id": "cell1",
             "metadata": {},
             "outputs": [],
             "source": [
              "import numpy as np\n",
              "import torch\n",
              "import gpytorch\n",
              "import healpy\n",
              "from ps_eor import ml_gpr, datacube, psutil, pspec\n",
              "from astropy.cosmology import WMAP7\n",
              "pspec.psutil.set_cosmology(WMAP7)\n",
              "assert hasattr(ml_gpr, 'MLGPRForegroundFitter') or hasattr(ml_gpr, 'MCMCSampler')\n",
              "print('Kernel test passed')"
             ]
            }
           ],
           "metadata": {
            "kernelspec": {
             "display_name": "SWF-8 ps_eor (Spack Py3.11)",
             "language": "python",
             "name": "swf8"
            }
           },
           "nbformat": 4,
           "nbformat_minor": 5
          }
          EOF
          docker run --rm \
            -e MPLCONFIGDIR=/tmp/mpl \
            -v /tmp/test_kernel.ipynb:/tmp/test_kernel.ipynb:ro \
            "${IMAGE_REF}" \
            jupyter execute /tmp/test_kernel.ipynb --kernel_name=swf8 --timeout=120 --output=/tmp/out.ipynb

  promote-pass:
    name: Publish -pass tag after tests pass
    needs: [build-pretest, test]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta (-pass)
        id: meta-pass
        uses: docker/metadata-action@v5
        with:
          images: >-
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: |
            suffix=-pass

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push (-pass)
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect -pass image
        run: |
          IMAGE_REF="${{ fromJSON(steps.meta-pass.outputs.json).tags[0] }}"
          docker buildx imagetools inspect "$IMAGE_REF"

      - name: Analyze final image layer sizes
        run: |
          IMAGE_REF="${{ fromJSON(steps.meta-pass.outputs.json).tags[0] }}"
          docker pull --platform linux/amd64 "$IMAGE_REF"
          python3 .github/scripts/analyze_image_layers.py "$IMAGE_REF"
