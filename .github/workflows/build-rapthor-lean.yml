---
# Size-optimised sibling of build-rapthor-jupyter.yml, building
# rapthor-lean.Dockerfile: the same Spack stack with no Jupyter, conda or TeX.
# Measured 1721 MB on disk / 521 MB compressed, against 5679 MB / 1.52 GB for
# rapthor-jupyter. This is the image the SRCNet OKE demo pulls as
# RAPTHOR_IMAGE once per CWL step, so its size is on the demo's critical path.
name: Build Rapthor Lean Container

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests during build (1=yes, 0=no)"
        required: false
        default: "0"
  pull_request:
    paths:
      - "rapthor-lean.Dockerfile"
      - "docker/rapthor-lean/**"
      - "spack-overlay/**"
      - ".github/workflows/build-rapthor-lean.yml"
  push:
    branches:
      - main
      - numpy2
    paths:
      - "rapthor-lean.Dockerfile"
      - "docker/rapthor-lean/**"
      - "spack-overlay/**"
      - ".github/workflows/build-rapthor-lean.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: rapthor-lean

jobs:
  build-pretest:
    name: Build and publish -pretest by digest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux/amd64
          - os: ubuntu-22.04-arm
            platform: linux/arm64
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
          wf="${{ github.workflow }}"
          safe_wf=$(echo "$wf" | sed -E 's/[^A-Za-z0-9._-]+/-/g')
          echo "CACHE_SCOPE=${safe_wf}-${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check disk space
        run: df -h

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          [ -n "$AGENT_TOOLSDIRECTORY" ] && sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/miniconda
          sudo docker system prune -af --volumes
          sudo apt-get clean

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:v0.13.2
            network=host
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1
              gc = true
              gckeepstorage = 5000
            [worker.containerd]
              max-parallelism = 1
              gc = true
              gckeepstorage = 5000

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (-pretest)
        id: meta-pretest
        uses: docker/metadata-action@v5
        with:
          images: >-
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: |
            suffix=-pretest
          labels: |
            org.opencontainers.image.title=Rapthor Lean
            org.opencontainers.image.description=Minimal Rapthor LOFAR pipeline runtime (no Jupyter/conda/TeX)

      - name: Build - by digest (always push)
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./rapthor-lean.Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta-pretest.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            SPACK_TARGET=${{ matrix.platform == 'linux/amd64' && 'x86_64_v2' || 'aarch64' }}
            # Deliberately the *rapthor-jupyter* buildcache, not a lean-specific
            # one: rapthor-lean.Dockerfile concretises to the identical CPU-only
            # Spack spec, so sharing the mirror makes every package a binary hit
            # for both images instead of compiling the same stack twice.
            SPACK_MIRROR_OCI=oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/rapthor-jupyter-spack-buildcache
          secrets: |
            spack_oci_username=${{ github.actor }}
            spack_oci_password=${{ github.token }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:buildcache-${{ env.PLATFORM_PAIR }}
          cache-to: |
            type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:buildcache-${{ env.PLATFORM_PAIR }},mode=max,compression=zstd,compression-level=3

      - name: Check disk space after build
        if: always()
        run: df -h

      - name: Export digest (push)
        if: steps.build-push.outcome == 'success'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build-push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest (push)
        if: steps.build-push.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-pretest:
    name: Publish multi-arch -pretest tag
    runs-on: ubuntu-latest
    needs: build-pretest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta (-pretest)
        id: meta-pretest
        uses: docker/metadata-action@v5
        with:
          images: >-
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: |
            suffix=-pretest

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push (-pretest)
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect -pretest image
        run: |
          IMAGE_REF="${{ fromJSON(steps.meta-pretest.outputs.json).tags[0] }}"
          docker buildx imagetools inspect "$IMAGE_REF"

  test:
    name: Run tests in image
    needs: [build-pretest, merge-pretest]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux/amd64
          - os: ubuntu-22.04-arm
            platform: linux/arm64
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Docker meta (-pretest)
        id: meta-pretest
        uses: docker/metadata-action@v5
        with:
          images: >-
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: |
            suffix=-pretest

      - name: Free up disk space for tests
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          [ -n "$AGENT_TOOLSDIRECTORY" ] && sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/miniconda
          sudo docker system prune -af --volumes
          sudo apt-get clean

      - name: Run smoke tests
        run: |
          IMAGE_REF="${{ fromJSON(steps.meta-pretest.outputs.json).tags[0] }}"
          docker run --rm "${IMAGE_REF}" python3 --version
          # PATH alone must be enough: the demo's run-ical.sh imports rapthor
          # with PYTHONPATH deliberately cleared.
          docker run --rm -e PYTHONPATH= "${IMAGE_REF}" python3 -c "
          import casacore.tables, numpy, rapthor, toil, cwltool, lsmtool, losoto
          import bdsf, benchmon, everybeam, astropy, reproject, tables, numexpr
          import h5py, matplotlib, scipy, pandas, kubernetes
          print('all runtime imports OK; numpy', numpy.__version__)"
          docker run --rm "${IMAGE_REF}" rapthor --version

      - name: Verify pipeline executables
        run: |
          IMAGE_REF="${{ fromJSON(steps.meta-pretest.outputs.json).tags[0] }}"
          docker run --rm -e OPENBLAS_NUM_THREADS=1 "${IMAGE_REF}" DP3 --version
          docker run --rm -e OPENBLAS_NUM_THREADS=1 "${IMAGE_REF}" wsclean --version
          docker run --rm "${IMAGE_REF}" aoflagger --version
          docker run --rm "${IMAGE_REF}" toil-cwl-runner --version

      - name: Verify benchmon profiling stack
        run: |
          IMAGE_REF="${{ fromJSON(steps.meta-pretest.outputs.json).tags[0] }}"
          # The demo's benchmon-collectors.yaml runs these from this image.
          docker run --rm "${IMAGE_REF}" bash -c '
            set -e
            benchmon-run --help >/dev/null
            benchmon-visu --help >/dev/null
            command -v benchmon-start benchmon-stop dool perf lspci
            perf --version || test $? -eq 126
            echo "benchmon stack OK"'

      - name: Verify cwltool can evaluate CWL JavaScript
        run: |
          IMAGE_REF="${{ fromJSON(steps.meta-pretest.outputs.json).tags[0] }}"
          # Regression guard: `import cwltool` succeeds without a Node engine,
          # but every rapthor operation dies at runtime with
          # cwl_utils.errors.JavascriptException. Only executing a workflow
          # that evaluates a JS expression catches it.
          docker run --rm "${IMAGE_REF}" bash -c '
            set -e
            command -v node
            node --version
            d=$(mktemp -d); cd "$d"
            cat > js.cwl <<CWL
          cwlVersion: v1.2
          class: ExpressionTool
          requirements: {InlineJavascriptRequirement: {}}
          inputs: {num: int}
          outputs: {doubled: int}
          expression: "\${ return {doubled: inputs.num * 2}; }"
          CWL
            out=$(cwltool --quiet js.cwl --num 21 2>&1)
            echo "$out"
            echo "$out" | grep -q 42 || { echo "CWL JS evaluation failed" >&2; exit 1; }
            echo "cwltool JavaScript evaluation OK"'

      - name: Verify /tmp is world-writable and sticky
        run: |
          IMAGE_REF="${{ fromJSON(steps.meta-pretest.outputs.json).tags[0] }}"
          # COPYing anything into /tmp rewrites its mode and drops the sticky
          # bit, leaving it root-only 755. That breaks apt in downstream builds
          # and every non-root process needing scratch -- i.e. each Toil step
          # running under an arbitrary host uid.
          mode=$(docker run --rm "${IMAGE_REF}" stat -c '%a' /tmp)
          echo "/tmp mode: ${mode}"
          [ "${mode}" = "1777" ] || { echo "expected 1777" >&2; exit 1; }
          docker run --rm --user 12345:12345 "${IMAGE_REF}" \
            bash -c 'touch /tmp/probe && echo "non-root can write /tmp"'

      - name: Verify none of the Jupyter/conda bloat came back
        run: |
          IMAGE_REF="${{ fromJSON(steps.meta-pretest.outputs.json).tags[0] }}"
          docker run --rm "${IMAGE_REF}" bash -c '
            set -e
            for p in /opt/conda /usr/share/texlive /usr/bin/pandoc /opt/spack; do
              if [ -e "$p" ]; then echo "regression: $p is back in the image" >&2; exit 1; fi
            done
            # /opt/view must be a symlink into /opt/._view, not a second copy.
            test -L /opt/view || { echo "regression: /opt/view is not a symlink (view duplicated)" >&2; exit 1; }
            for m in marimo jupyterlab notebook jupyterhub; do
              if python3 -c "import $m" 2>/dev/null; then
                echo "regression: $m is installed in the lean image" >&2; exit 1
              fi
            done
            echo "no notebook/conda/TeX bloat present"'

      - name: Enforce image size budget
        run: |
          IMAGE_REF="${{ fromJSON(steps.meta-pretest.outputs.json).tags[0] }}"
          used=$(docker run --rm --user 0 "${IMAGE_REF}" bash -c 'du -sm / 2>/dev/null | cut -f1' | tail -1)
          echo "on-disk contents: ${used} MB (rapthor-jupyter baseline: 5679 MB)"
          # Measured 1721 MB; fail well before it drifts back toward the
          # jupyter image, but leave room for genuine dependency growth.
          if [ "${used}" -gt 2400 ]; then
            echo "image grew past the 2400 MB budget - re-run the layer analysis" >&2
            exit 1
          fi


  promote-pass:
    name: Publish -pass tag after tests pass
    needs: [build-pretest, test]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta (-pass)
        id: meta-pass
        uses: docker/metadata-action@v5
        with:
          images: >-
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: |
            suffix=-pass

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push (-pass)
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect -pass image
        run: |
          IMAGE_REF="${{ fromJSON(steps.meta-pass.outputs.json).tags[0] }}"
          docker buildx imagetools inspect "$IMAGE_REF"

      - name: Analyze final image size (layers + on-disk paths)
        run: |
          IMAGE_REF="${{ fromJSON(steps.meta-pass.outputs.json).tags[0] }}"
          docker pull --platform linux/amd64 "$IMAGE_REF"
          # Reports docker-history layer diffs AND du of /opt/software|/opt/view
          # (dive-style symlink following misattributes view COPY as multi-GB).
          python3 .github/scripts/analyze_image_layers.py "$IMAGE_REF"
